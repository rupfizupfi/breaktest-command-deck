spring.profiles.default=dev
# 'bench' is the operator-facing name for the deployment profile; a real bench runs natively
# because the drivers are Windows-only (OQ-79). SPRING_PROFILES_ACTIVE=bench activates 'docker'.
spring.profiles.group.bench=docker

logging.level.org.atmosphere=warn
spring.mustache.check-template-location=false

# Launch the default browser when starting the application in development mode
vaadin.launch-browser=true
vaadin.devmode.devTools.enabled=false

# Workaround for https://github.com/vaadin/hilla/issues/842
spring.devtools.restart.additional-exclude=dev/hilla/openapi.json
# To improve the performance during development.
# For more information https://vaadin.com/docs/latest/integrations/spring/configuration#special-configuration-parameters
vaadin.allowed-packages = com.vaadin,org.vaadin,ch.rupfizupfi.deck
vaadin.exclude-urls: /api/**
vaadin.analytics.enabled=false
# Package manager for frontend installs. Must match pnpmEnable in build.gradle,
# otherwise dev mode and the Gradle build install into node_modules differently.
vaadin.pnpm.enable=true

# Flyway owns the schema (cms/src/main/resources/db/migration); Hibernate only validates it.
# Whichever app boots first migrates, the other finds it current. A database that predates the
# migrations is baselined at V1, the schema ddl-auto had built, and gets only V2 onwards.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# real|simulated, enforced by HardwareModeCheck in command-deck; real without the driver jars in
# drivers/ fails startup. Deployments set DECK_HARDWARE_MODE; the `real` default fails safe.
deck.hardware.mode=real

# Lax keeps the session cookie off cross-site POSTs, a second line behind the CSRF token.
server.servlet.session.cookie.same-site=lax

# Batches the eager owner/parent graph (and User.roles) into IN-queries, so a grid page costs a
# fixed handful of selects instead of one per row (B-16); EagerGraphQueryCountTest pins it.
spring.jpa.properties.hibernate.default_batch_fetch_size=50
