server.port=${PORT:443}
spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming_strategy=org.hibernate.cfg.ImprovedNamingStrategy
spring.sql.init.mode=always
# Overridable so one deployment profile serves both the container and a native bench run.
# The default is the Compose-local db; the tester must point DB_URL at the cloud Postgres,
# which is the authoritative dataset (OQ-61). No fallback to local on failure - a deck that
# cannot reach the real database must fail at startup, not quietly write results elsewhere.
spring.datasource.url=${DB_URL:jdbc:postgresql://db:5432/rupfizupfi}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=rupfizupfi
spring.datasource.password=${DB_PASSWORD}

server.ssl.enabled=true
server.ssl.key-store-type=PKCS12
# The container path by default; a native bench run overrides KEY_STORE_PATH. This is the
# only container-shaped literal left in this file, and parameterising it is what makes a
# separate 'bench' profile unnecessary.
server.ssl.key-store=${KEY_STORE_PATH:/home/appuser/keystore/rupfizupfi.p12}
server.ssl.key-store-password=${KEY_STORE_PASSWORD}
server.ssl.key-alias=rupfizupfi

# Deliberately unset here. This profile serves two deployments that differ in exactly this
# property - the native Windows bench (real, via script/run-bench.ps1) and the deck container
# (simulated, for tests and simulations; its Linux image cannot reach the hardware at all). Each
# declares its own with DECK_HARDWARE_MODE, and an environment variable outranks every
# application*.properties file. Unset by both, application.properties supplies `real`, which is the
# fail-safe direction: a deployment that forgot to say gets the mode that refuses to start without
# drivers rather than one that quietly simulates.
