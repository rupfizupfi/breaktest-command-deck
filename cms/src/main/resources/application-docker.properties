server.port=${PORT:443}
spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming_strategy=org.hibernate.cfg.ImprovedNamingStrategy
spring.sql.init.mode=always
spring.datasource.url=jdbc:postgresql://db:5432/rupfizupfi
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=rupfizupfi
spring.datasource.password=${DB_PASSWORD}

server.ssl.enabled=true
server.ssl.key-store-type=PKCS12
server.ssl.key-store=/home/appuser/keystore/rupfizupfi.p12
server.ssl.key-store-password=${KEY_STORE_PASSWORD}
server.ssl.key-alias=rupfizupfi