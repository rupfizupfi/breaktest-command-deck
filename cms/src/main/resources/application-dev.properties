server.port=${PORT:8080}
logging.level.org.atmosphere=warn
vaadin.devmode.devTools.enabled=true
logging.level.web=DEBUG

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.h2.console.enabled=true
# PostgreSQL mode so the migrations, written for production, run unchanged. No DATABASE_TO_LOWER:
# H2 cannot open a file created with the default upper-case identifiers under it.
spring.datasource.url=jdbc:h2:file:${DECK_H2_DIR:./.data}/deck;MODE=PostgreSQL;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# spring.profiles.default=dev, so an unset SPRING_PROFILES_ACTIVE lands here, in simulation.
deck.hardware.mode=simulated
