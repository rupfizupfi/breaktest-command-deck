bootJar {
    archiveBaseName = 'cms-application'
    enabled = true
}

jar {
    archiveBaseName = 'cms-library'
    enabled = true
}

tasks.named('bootRun') {
    // Both modules must share one dev H2 file. Passed as an absolute path rather than by setting
    // workingDir: Vaadin's DevModeInitializer resolves the @Theme folder against the working directory.
    environment 'DECK_H2_DIR', "${rootProject.projectDir}/.data"
    // Dev mode runs pnpm without a TTY; CI=true stops it aborting with
    // ERR_PNPM_ABORTED_REMOVE_MODULES_DIR_NO_TTY.
    environment 'CI', 'true'
}

dependencies {
    // cms owns the schema: its migrations ship in this jar, so command-deck migrates the same way.
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    // The .xlsx result export (DownloadResults). command-deck gets it at runtime through
    // project(':cms'), which is all it needs: it compiles against no POI type.
    implementation 'org.apache.poi:poi:5.5.1'
    implementation 'org.apache.poi:poi-ooxml:5.5.1'

    // Persistence tests run against PostgreSQL (Testcontainers), the production database, not H2.
    // Versions come from the Boot BOM; Testcontainers 2.x uses the testcontainers-* coordinates.
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
}
