pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.vaadin.com/vaadin-prereleases' }
    }
    plugins {
        id 'com.vaadin' version "${vaadinVersion}"
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

include 'cms'
include 'command-deck'

