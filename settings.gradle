pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.vaadin.com/vaadin-prereleases' }
    }
    plugins {
        id 'com.vaadin' version "${vaadinVersion}"
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

include 'cms'
include 'command-deck'

// The hardware contract lives in its own build so the driver repos can composite-include it
// without configuring the deck's Spring Boot / Vaadin build. Substitutes
// ch.rupfizupfi.deck:device-api wherever it is depended on.
includeBuild 'device-api'

