name: rupfizupfi

services:
  server-cms:
    build:
      context: ..
      dockerfile: cms/Dockerfile
    secrets:
      - db-password
    ports:
      - 8043:443
    volumes:
      - ./breaktester:/home/appuser/breaktester
      - ./keystore:/home/appuser/keystore
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - KEY_STORE_PASSWORD=${KEY_STORE_PASSWORD}
      - DB_PASSWORD_FILE=/run/secrets/db-password
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - cms

  server-deck:
    build:
      context: ..
      dockerfile: command-deck/Dockerfile
      args:
        - GITHUB_ACTOR=${GITHUB_ACTOR:-docker-build}
      # Read access to the published dscusb driver plugin. Needs read:packages only.
      secrets:
        - github-token
    secrets:
      - db-password
    ports:
      - 8043:443
    volumes:
      - ./breaktester:/home/appuser/breaktester
      - ./keystore:/home/appuser/keystore
      # The licence-restricted CFW11 driver plugin: host-provided, read-only, never in the image.
      # Second entry on the container's LOADER_PATH; drop the jar in and restart, no rebuild.
      - ./drivers-local:/app/drivers-local:ro
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - KEY_STORE_PASSWORD=${KEY_STORE_PASSWORD}
      - DB_PASSWORD_FILE=/run/secrets/db-password
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - deck

  db:
    image: postgres
    restart: always
    user: postgres
    secrets:
      - db-password
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=rupfizupfi
      - POSTGRES_USER=rupfizupfi
      - POSTGRES_PASSWORD_FILE=/run/secrets/db-password
    expose:
      - 5432
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:

secrets:
  db-password:
    file: ../.secrets/db-password.txt
  # Build-time only: a PAT with read:packages, used to resolve ch.rupfizupfi.dscusb:dscusb.
  # Only the deck image build reads it.
  #
  # Environment-backed rather than file-backed on purpose. A `file:` secret whose path does not
  # exist makes compose fail *before* the build starts, which would make the token mandatory and
  # break the rule that a missing driver is a startup failure and never a build failure. With
  # `environment:`, an unset GITHUB_TOKEN yields an empty secret, the build proceeds, stageDrivers
  # warns, and /app/drivers ships empty. Set it in docker/.env on the tester.
  github-token:
    environment: GITHUB_TOKEN
