name: rupfizupfi

services:
  server-cms:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        - MODULE=cms
    secrets:
      - db-password
    ports:
      - 8043:443
    volumes:
      - ./breaktester:/home/appuser/breaktester
      - ./keystore:/home/appuser/keystore
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - KEY_STORE_PASSWORD=${KEY_STORE_PASSWORD:-}
      - DB_PASSWORD_FILE=/run/secrets/db-password
      # Creates the first ADMIN when none exists (InitialAdminBootstrap); /run/secrets/admin-password also works.
      - DECK_ADMIN_PASSWORD=${DECK_ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # The images carry no curl/wget and the app has no actuator, so this proves only that the HTTPS
      # listener accepts connections (bash is present: startup.sh uses it). Not a login or DB probe.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/443"]
      interval: 15s
      timeout: 5s
      retries: 5
      # Flyway plus the Vaadin/Spring boot take well over a minute on a small host.
      start_period: 120s
    profiles:
      - cms

  server-deck:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        - MODULE=command-deck
    secrets:
      - db-password
    ports:
      - 8043:443
    volumes:
      - ./breaktester:/home/appuser/breaktester
      - ./keystore:/home/appuser/keystore
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      # Test/simulation deployment only: the drivers are Windows-only, and the bench runs natively
      # (script/run-bench.ps1). HardwareModeCheck refuses simulation under the `bench` profile.
      - DECK_HARDWARE_MODE=simulated
      - KEY_STORE_PASSWORD=${KEY_STORE_PASSWORD:-}
      - DB_PASSWORD_FILE=/run/secrets/db-password
      # Creates the first ADMIN when none exists (InitialAdminBootstrap); /run/secrets/admin-password also works.
      - DECK_ADMIN_PASSWORD=${DECK_ADMIN_PASSWORD:-}
      # Compose-local db by default so simulated results stay out of the cloud dataset (OQ-61).
      - DB_URL=${DECK_DB_URL:-jdbc:postgresql://db:5432/rupfizupfi}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # The images carry no curl/wget and the app has no actuator, so this proves only that the HTTPS
      # listener accepts connections (bash is present: startup.sh uses it). Not a login or DB probe.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/443"]
      interval: 15s
      timeout: 5s
      retries: 5
      # Flyway plus the Vaadin/Spring boot take well over a minute on a small host.
      start_period: 120s
    profiles:
      - deck

  db:
    # Pinned to what production runs (18.6, Debian trixie); minor bumps via Dependabot, a major bump needs
    # pg_upgrade or dump/restore. Since 18 the data lives under /var/lib/postgresql/18/docker, so mount the parent.
    image: postgres:18.6-trixie
    restart: always
    user: postgres
    secrets:
      - db-password
    volumes:
      - db-data:/var/lib/postgresql
    environment:
      - POSTGRES_DB=rupfizupfi
      - POSTGRES_USER=rupfizupfi
      - POSTGRES_PASSWORD_FILE=/run/secrets/db-password
    expose:
      - 5432
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "rupfizupfi", "-d", "rupfizupfi"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  db-data:

secrets:
  db-password:
    file: ../.secrets/db-password.txt
