name: rupfizupfi

services:
  server-cms:
    build:
      context: ..
      dockerfile: cms/Dockerfile
    ports:
      - 8080:8080
    volumes:
      - app-data:/home/appuser/rupfizupfi
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - cms

  db:
    image: postgres
    restart: always
    user: postgres
    secrets:
      - db-password
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=example
      - POSTGRES_PASSWORD_FILE=/run/secrets/db-password
    expose:
      - 5432
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:
  app-data:

secrets:
  db-password:
    file: ../.secrets/db-password.txt
