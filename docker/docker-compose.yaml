name: rupfizupfi

services:
  server-cms:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        - MODULE=cms
    secrets:
      - db-password
    ports:
      - 8043:443
    volumes:
      - ./breaktester:/home/appuser/breaktester
      - ./keystore:/home/appuser/keystore
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - KEY_STORE_PASSWORD=${KEY_STORE_PASSWORD}
      - DB_PASSWORD_FILE=/run/secrets/db-password
      # Both images create appuser with --home /nonexistent, so user.home cannot be the storage
      # root: `~/breaktester` would resolve away from the bind mount below.
      - DECK_STORAGE_ROOT=/home/appuser
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - cms

  server-deck:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        - MODULE=command-deck
    secrets:
      - db-password
    ports:
      - 8043:443
    volumes:
      - ./breaktester:/home/appuser/breaktester
      - ./keystore:/home/appuser/keystore
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      # This container is the deck's test and simulation deployment. It never drives the machine:
      # both drivers are Windows-only and refuse to register on Linux, so real mode here could only
      # refuse to start. The bench runs natively instead (script/run-bench.ps1, which declares
      # real). HardwareModeCheck permits simulation under `docker` but not under `bench`, so this
      # value cannot leak onto the machine by copying the profile.
      - DECK_HARDWARE_MODE=simulated
      - KEY_STORE_PASSWORD=${KEY_STORE_PASSWORD}
      - DB_PASSWORD_FILE=/run/secrets/db-password
      # The image creates appuser with --home /nonexistent, so user.home cannot be the storage
      # root: `~/breaktester` would resolve away from the bind mount below.
      - DECK_STORAGE_ROOT=/home/appuser
      # The Compose-local db by default, which is the right target for simulated runs - their
      # results must not land in the authoritative dataset. Only the native bench points at the
      # cloud Postgres (OQ-61), and it does so through run-bench.ps1, not through this file.
      - DB_URL=${DECK_DB_URL:-jdbc:postgresql://db:5432/rupfizupfi}
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - deck

  db:
    image: postgres
    restart: always
    user: postgres
    secrets:
      - db-password
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=rupfizupfi
      - POSTGRES_USER=rupfizupfi
      - POSTGRES_PASSWORD_FILE=/run/secrets/db-password
    expose:
      - 5432
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:

# One secret, and it is a real one: the database password. The build needs none - nothing it
# resolves is private - so there is no build-time secret, no placeholder file and no token path to
# configure.
secrets:
  db-password:
    file: ../.secrets/db-password.txt
