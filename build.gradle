buildscript {
	repositories {
		mavenCentral()
		maven { setUrl("https://maven.vaadin.com/vaadin-prereleases") }
		maven { setUrl("https://repo.spring.io/milestone") }
	}
}
plugins {
	id 'org.springframework.boot' version "${springBootVersion}" apply false
	id 'io.spring.dependency-management' version '1.1.7' apply false
	id 'com.vaadin' version "$vaadinVersion" apply false
}

subprojects {
	apply plugin: 'java'
	apply plugin: 'org.springframework.boot'
	apply plugin: 'io.spring.dependency-management'
	apply plugin: 'com.vaadin'

	repositories {
		mavenCentral()
		maven { url = "https://maven.vaadin.com/vaadin-prereleases" }
		maven { url = "https://repo.spring.io/milestone" }
		maven { url = "https://maven.vaadin.com/vaadin-addons" }
	}

	dependencies {
		implementation 'com.vaadin:vaadin-core'
		runtimeOnly 'com.h2database:h2'
		runtimeOnly "org.postgresql:postgresql"
		implementation 'com.vaadin:vaadin-spring-boot-starter'
		// Vaadin 25 no longer bundles Hilla in vaadin-spring-boot-starter; React views need this explicitly.
		implementation 'com.vaadin:hilla-spring-boot-starter'
		implementation 'org.springframework.boot:spring-boot-starter-security'
		implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
		implementation 'org.springframework.boot:spring-boot-starter-validation'
		implementation 'org.springframework.boot:spring-boot-starter-websocket'
		// Renamed from spring-boot-starter-aop in Spring Boot 4.
		implementation 'org.springframework.boot:spring-boot-starter-aspectj'
		implementation 'org.parttio:line-awesome:2.1.0'
		implementation 'org.apache.poi:poi:5.5.1'
		implementation 'org.apache.poi:poi-ooxml:5.5.1'
		implementation 'com.fazecast:jSerialComm:2.11.4'
		// vaadin-dev is optional as of Vaadin 25 and must be requested explicitly.
		developmentOnly 'org.springframework.boot:spring-boot-devtools'
		developmentOnly 'com.vaadin:vaadin-dev'
		testImplementation 'org.springframework.boot:spring-boot-starter-test'
		// slf4j-api and logback-classic versions are managed by the Spring Boot BOM.
		implementation 'org.slf4j:slf4j-api'
		implementation 'ch.qos.logback:logback-classic'
	}

	dependencyManagement {
		imports {
			mavenBom "com.vaadin:vaadin-bom:${vaadinVersion}"
		}
	}

	java {
		toolchain {
			languageVersion.set(JavaLanguageVersion.of(26))
		}
	}

	vaadin {
		productionMode = false
		optimizeBundle = false
		// pnpm hard-links from a shared store, so cms and command-deck no longer
		// keep two near-identical copies of the same dependency tree on disk.
		// Vaadin fetches its own pinned pnpm, so useGlobalPnpm stays off.
		pnpmEnable = true
	}
}
