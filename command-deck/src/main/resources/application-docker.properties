server.port=${PORT:443}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
# Overridable so one profile serves both the container and a native bench run. Defaults to the
# Compose-local db; the tester must point DB_URL at the cloud Postgres (OQ-61). No fallback: an
# unreachable database fails startup.
spring.datasource.url=${DB_URL:jdbc:postgresql://db:5432/rupfizupfi}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=rupfizupfi
spring.datasource.password=${DB_PASSWORD}

server.ssl.enabled=true
server.ssl.key-store-type=PKCS12
# The container path by default; a native bench run overrides KEY_STORE_PATH.
server.ssl.key-store=${KEY_STORE_PATH:/home/appuser/keystore/rupfizupfi.p12}
server.ssl.key-store-password=${KEY_STORE_PASSWORD}
server.ssl.key-alias=rupfizupfi

# deck.hardware.mode is unset here: the native bench (real, script/run-bench.ps1) and the deck
# container (simulated) each set DECK_HARDWARE_MODE. Unset by both, application.properties supplies
# the fail-safe `real`.
