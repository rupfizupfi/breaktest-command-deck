# The bench's per-machine settings come from one env file (copy script/bench.env.example to
# .secrets/bench.env). Its KEY=VALUE lines resolve the ${DB_URL}, ${DB_PASSWORD}, ${KEY_STORE_PATH}
# and ${KEY_STORE_PASSWORD} placeholders in application-docker.properties; a real environment variable
# of the same name still wins. bootRun and run-bench.ps1 point DECK_ENV_FILE at the repo's copy, so
# the working directory does not matter. Read as .properties: a backslash is an escape, so paths use /.
spring.config.import=optional:file:${DECK_ENV_FILE:.secrets/bench.env}[.properties]
