spring.profiles.default=dev
# An honest operator-facing name for the deployment profile, which is no longer only Docker:
# the drivers are Windows-only, so a real bench runs this natively (OQ-79). A group, not a
# second properties file - SPRING_PROFILES_ACTIVE=bench activates 'docker' too, so there is
# one deployment configuration and the simulation guard sees a non-dev profile either way.
spring.profiles.group.bench=docker

logging.level.org.atmosphere=warn
spring.mustache.check-template-location=false
spring.main.allow-circular-references=true

# Launch the default browser when starting the application in development mode
vaadin.launch-browser=true
vaadin.devmode.devTools.enabled=false

# Workaround for https://github.com/vaadin/hilla/issues/842
spring.devtools.restart.additional-exclude=dev/hilla/openapi.json
# To improve the performance during development.
# For more information https://vaadin.com/docs/latest/integrations/spring/configuration#special-configuration-parameters
vaadin.allowed-packages = com.vaadin,org.vaadin,ch.rupfizupfi.deck
vaadin.exclude-urls: /api/**
vaadin.analytics.enabled=false
# Package manager for frontend installs. Must match pnpmEnable in build.gradle,
# otherwise dev mode and the Gradle build install into node_modules differently.
vaadin.pnpm.enable=true

# How the deck reaches the machine: real|simulated. Enforced by HardwareModeCheck at startup, which
# never falls back - real without the driver jars in drivers/ is a startup failure, not a simulated
# run. Deployments override it with DECK_HARDWARE_MODE (env beats every properties file): the bench
# declares real, the deck container declares simulated. This default is `real` so that forgetting to
# declare a mode refuses to start rather than quietly simulating.
deck.hardware.mode=real
