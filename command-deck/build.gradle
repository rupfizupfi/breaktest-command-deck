dependencies {
    implementation project(':cms')
    // Substituted by the device-api included build (root settings.gradle); the version here is
    // inert, device-api/build.gradle decides.
    implementation 'ch.rupfizupfi.deck:device-api:1.0.0'
    // Serial port of the four-way relay switch (FourWayRelaySwitch); no cms code touches a port.
    implementation 'com.fazecast:jSerialComm:2.11.4'
    // DriveContractTest / LoadCellStreamContractTest, extended by the simulator's own tests. Same
    // substitution, so the fixtures always match the contract the simulator compiles against.
    testImplementation(testFixtures('ch.rupfizupfi.deck:device-api:1.0.0'))
    // ArchitectureTest (OQ-64 step 10). Not managed by the Boot BOM, hence the version. The core
    // library, not archunit-junit5: the rules run inside plain Jupiter tests, so no second test
    // engine has to track the JUnit Platform version the BOM picks.
    testImplementation 'com.tngtech.archunit:archunit:1.5.1'
}

// Vendor driver jars (../dscusb, ../usbmodbus) are runtime plugins, never build inputs: the boot jar
// contains no driver, PropertiesLauncher loads them from loader.path at launch, and a missing jar is
// a startup failure named by HardwareModeCheck. Only the native Windows bench (run-bench.ps1)
// supplies one; the container runs simulated.
//
// drivers/ is the one place a plugin jar goes; bootRun, driverPluginTest and run-bench.ps1 (via
// LOADER_PATH) all read it, and an empty directory is fine. deck.hardware.mode decides at startup
// which provider is active - the driver auto-configurations are conditional on mode=real, so under
// `simulated` the jars sit inert (`bootRun --args='--deck.hardware.mode=real'` to use them).
//
// developmentOnly is excluded from bootJar, which keeps the licence-restricted usbmodbus.jar out of
// every artifact.
def driverPluginDir = "${rootProject.projectDir}/drivers"
def driverPluginJars = fileTree(driverPluginDir) { include '*.jar' }

dependencies {
    developmentOnly driverPluginJars
}

tasks.named('bootRun') {
    // Both modules must resolve the dev H2 file to the same path. Passed via env var (the
    // ${DECK_H2_DIR:...} placeholder in spring.datasource.url) rather than by changing the working
    // directory, because Vaadin resolves the @Theme folder relative to the working directory.
    environment 'DECK_H2_DIR', "${rootProject.projectDir}/.data"
    // Vaadin runs pnpm from this process; without a TTY pnpm aborts with
    // ERR_PNPM_ABORTED_REMOVE_MODULES_DIR_NO_TTY. CI=true makes it non-interactive.
    environment 'CI', 'true'
    // The bench profile's env file (application-bench.properties), as an absolute path because the
    // working directory is this module. Forward slashes: Spring reads it as a file: URL.
    environment 'DECK_ENV_FILE', System.getenv('DECK_ENV_FILE') ?: "${rootProject.projectDir}/.secrets/bench.env".replace('\\', '/')
}

// The Vaadin plugin reads the runtime classpath without declaring a dependency on it, so a
// standalone `hillaGenerate` (script/typecheck.ps1) fails with "querying ... before task
// ':device-api:jar' has completed is not supported". `build` gets the jar via compilation.
def deviceApiJar = gradle.includedBuild('device-api').task(':jar')
tasks.matching {
    it.name in ['hillaGenerate', 'hillaConfigure', 'vaadinPrepareFrontend', 'vaadinBuildFrontend']
}.configureEach {
    dependsOn deviceApiJar
}

bootJar {
    archiveBaseName = 'command-deck-application'
    enabled = true
    manifest {
        // PropertiesLauncher instead of JarLauncher: it adds the loader.path directories
        // (LOADER_PATH / -Dloader.path) to the classpath, which is how driver plugins load.
        attributes 'Main-Class': 'org.springframework.boot.loader.launch.PropertiesLauncher'
    }
}

jar {
    archiveBaseName = 'command-deck-library'
    enabled = true
}

// Verifies the jars actually in drivers/: that each registers its provider under mode=real and
// passes DeviceApi's version skew check. A separate task so `test` stays hermetic; the driver
// repos' compile checks the contract they were built against, this checks the one they run against.
def driverPluginTag = 'driver-plugin'

tasks.named('test') {
    // A machine with no driver must still go green.
    useJUnitPlatform {
        excludeTags driverPluginTag
    }
    // device-api's own suite (the call gate in its support package) has no gate of its own; running
    // it with the deck's tests puts it in the jvm gate.
    dependsOn gradle.includedBuild('device-api').task(':test')
}

tasks.register('driverPluginTest', Test) {
    group = 'verification'
    description = 'Boots the deck against the real driver plugins in drivers/ and asserts they register.'
    testClassesDirs = sourceSets.test.output.classesDirs
    // Plugins appended, the same precedence loader.path gives them, so device-api resolves to this
    // build's copy.
    classpath = sourceSets.test.runtimeClasspath + driverPluginJars
    useJUnitPlatform {
        includeTags driverPluginTag
    }
    // The tests list the jars to report what they checked, or skip when there are none.
    systemProperty 'deck.driverPluginDir', driverPluginDir
    // Re-run when the directory's contents change, not only the classpath.
    inputs.dir(driverPluginDir)
            .withPropertyName('driverPlugins')
            .optional()
            .withPathSensitivity(PathSensitivity.RELATIVE)
}
