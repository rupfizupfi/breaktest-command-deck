dependencies {
    implementation project(':cms')
    // Resolved by the device-api included build (root settings.gradle), never from a repository.
    implementation 'ch.rupfizupfi.deck:device-api:1.0.0'
}

// The vendor driver jars are runtime-only plugins. Each implements ch.rupfizupfi.deck:device-api in
// its own repo (../dscusb, ../usbmodbus — both composite-include device-api, so THEIR compile is the
// contract-conformance check) and ships a Spring Boot auto-configuration that registers its provider
// beans. Nothing in this module names a driver class; discovery is AutoConfiguration.imports at
// startup, so a jar dropped into lib/ is active on the next build and gone when removed.
//
// deckDrivers=off exists to build a deliberately hardware-free jar. There is no 'on': a missing jar
// must stay a *startup* failure named by HardwareModeCheck, never a build failure — a fresh clone
// without the licence-restricted usbmodbus.jar has to build.
def deckDrivers = providers.gradleProperty('deckDrivers').getOrElse('auto')
if (!(deckDrivers in ['auto', 'off'])) {
    throw new GradleException("deckDrivers=${deckDrivers} is not valid. Valid values: auto, off.")
}

if (deckDrivers == 'auto') {
    def driverJars = fileTree("${rootProject.projectDir}/lib") { include '*.jar' }
    dependencies {
        runtimeOnly driverJars
    }
    def names = driverJars.files.collect { it.name }.sort()
    logger.lifecycle(":command-deck: driver plugins from lib/: "
            + (names ? names.join(', ') : "none - deck.hardware.mode=real will refuse to start"))
} else {
    logger.lifecycle(":command-deck: deckDrivers=off - no driver plugins; "
            + "deck.hardware.mode=real will refuse to start")
}

// The Vaadin plugin queries the runtime classpath while its tasks execute, without declaring a
// task dependency on it — with device-api coming from an included build, a standalone
// `hillaGenerate` (script/typecheck.ps1) then fails with "querying ... before task
// ':device-api:jar' has completed is not supported". Compilation forces the jar as a side effect,
// which is why `build` never sees this; the Vaadin/Hilla tasks need it stated.
def deviceApiJar = gradle.includedBuild('device-api').task(':jar')
tasks.matching {
    it.name in ['hillaGenerate', 'hillaConfigure', 'vaadinPrepareFrontend', 'vaadinBuildFrontend']
}.configureEach {
    dependsOn deviceApiJar
}

bootJar {
    // Specific configuration for Command Deck application JAR
    archiveBaseName = 'command-deck-application'
    enabled = true
}

jar {
    // Library JAR configuration for shared components
    archiveBaseName = 'command-deck-library'
    enabled = true
}
