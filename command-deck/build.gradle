dependencies {
    implementation project(':cms')
    // Resolved by the device-api included build (root settings.gradle), never from a repository -
    // substitution matches on group:name, so the version here is inert and deliberately not chased
    // when the contract is bumped. What ships is whatever device-api/build.gradle says.
    implementation 'ch.rupfizupfi.deck:device-api:1.0.0'
}

// The vendor driver jars are runtime plugins, never build inputs. Each implements
// ch.rupfizupfi.deck:device-api in its own repo (../dscusb, ../usbmodbus — both composite-include
// device-api, so THEIR compile is the contract-conformance check) and ships a Spring Boot
// auto-configuration that registers its provider beans. Nothing in this module names a driver class.
//
// The boot jar therefore contains NO driver, in any build: bootJar runs through PropertiesLauncher
// (see the manifest below) and the drivers come from the loader.path directories at launch. A jar
// present there is loaded, a jar absent is not, and absence stays a *startup* failure named by
// HardwareModeCheck — put the jar in place and restart, no rebuild.
//
// Only one deployment ever supplies a driver: the native Windows bench, via run-bench.ps1. The deck
// container runs simulated (deck.hardware.mode=simulated, Linux, where both drivers refuse to
// register anyway), so nothing here fetches, stages or packages a driver for an image — and the
// licence-restricted usbmodbus.jar reaches no artifact by any route.
//
// drivers/ is the one place a plugin jar goes on this machine, and everything that consumes a
// driver reads it: bootRun below, driverPluginTest further down, and script/run-bench.ps1 through
// LOADER_PATH. An absent or empty directory contributes nothing and every task still runs.
//
// Unconditional, replacing an earlier -PdeckDrivers flag. Which provider a run gets is decided by
// deck.hardware.mode at startup, never by the build: both driver auto-configurations are
// @ConditionalOnProperty(deck.hardware.mode=real), mirroring this module's simulated providers, so
// under dev's default `simulated` the jars sit on the classpath inert. A build-time gate for a
// runtime-gated thing could only disagree with the property that actually governs, and it hid that
// property behind a second switch — `bootRun --args='--deck.hardware.mode=real'` is the whole
// interface now.
//
// developmentOnly is load-bearing: the Spring Boot plugin excludes it from bootJar, so no build can
// pack a driver. That is what keeps the licence-restricted usbmodbus.jar out of every artifact.
def driverPluginDir = "${rootProject.projectDir}/drivers"
def driverPluginJars = fileTree(driverPluginDir) { include '*.jar' }

dependencies {
    developmentOnly driverPluginJars
}

// The Vaadin plugin queries the runtime classpath while its tasks execute, without declaring a
// task dependency on it — with device-api coming from an included build, a standalone
// `hillaGenerate` (script/typecheck.ps1) then fails with "querying ... before task
// ':device-api:jar' has completed is not supported". Compilation forces the jar as a side effect,
// which is why `build` never sees this; the Vaadin/Hilla tasks need it stated.
def deviceApiJar = gradle.includedBuild('device-api').task(':jar')
tasks.matching {
    it.name in ['hillaGenerate', 'hillaConfigure', 'vaadinPrepareFrontend', 'vaadinBuildFrontend']
}.configureEach {
    dependsOn deviceApiJar
}

bootJar {
    // Specific configuration for Command Deck application JAR
    archiveBaseName = 'command-deck-application'
    enabled = true
    manifest {
        // PropertiesLauncher instead of the plugin's default JarLauncher: it extends the classpath
        // with the directories named by loader.path (LOADER_PATH env / -Dloader.path), which is how
        // the driver plugins get loaded at launch instead of being baked in. Start-Class and
        // Spring-Boot-Classes/Lib are still written by the plugin, so BOOT-INF stays on the
        // classpath and the app itself starts exactly as before. Boot 4 moved the launcher into
        // org.springframework.boot.loader.launch — the pre-3.2 name would fail with CNFE.
        attributes 'Main-Class': 'org.springframework.boot.loader.launch.PropertiesLauncher'
    }
}

jar {
    // Library JAR configuration for shared components
    archiveBaseName = 'command-deck-library'
    enabled = true
}

// The driver plugins are verified rather than assumed, and in a task of their own so `test` stays
// hermetic: dropping a jar into drivers/ must not change what the ordinary suite compiles against
// or runs. Tagged rather than a separate source set, so the driver tests sit beside the context
// test they mirror.
//
// This is the only automated check that the plugin contract holds end to end. Both facts it pins
// are invisible to every compiler: the jar on the machine is whatever was last copied there, so
// whether it registers its provider under deck.hardware.mode=real, and whether the device-api
// version javac inlined into it still satisfies DeviceApi's skew check, are properties of a file -
// not of this build. The driver repos' own compile checks the contract they were BUILT against;
// this checks the one they will RUN against.
def driverPluginTag = 'driver-plugin'

tasks.named('test') {
    // Vendor jars are driverPluginTest's business. A machine with no driver must still go green.
    useJUnitPlatform {
        excludeTags driverPluginTag
    }
}

tasks.register('driverPluginTest', Test) {
    group = 'verification'
    description = 'Boots the deck against the real driver plugins in drivers/ and asserts they register.'
    testClassesDirs = sourceSets.test.output.classesDirs
    // The app's own classpath first, the plugins appended - the same precedence loader.path gives
    // them at launch, so device-api resolves to this build's copy and not to anything a jar carries.
    classpath = sourceSets.test.runtimeClasspath + driverPluginJars
    useJUnitPlatform {
        includeTags driverPluginTag
    }
    // The tests locate the jars themselves to report which ones they checked, and to skip with a
    // reason when there are none. Handed over explicitly rather than resolved from a working
    // directory the task does not otherwise promise.
    systemProperty 'deck.driverPluginDir', driverPluginDir
    // The jars decide the outcome, so a swapped jar has to re-run this - the classpath alone would
    // catch that, but the directory may also gain or lose a file the classpath was built without.
    inputs.dir(driverPluginDir)
            .withPropertyName('driverPlugins')
            .optional()
            .withPathSensitivity(PathSensitivity.RELATIVE)
}
