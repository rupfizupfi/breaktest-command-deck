import javax.inject.Inject

dependencies {
    implementation project(':cms')
    // Resolved by the device-api included build (root settings.gradle), never from a repository.
    implementation 'ch.rupfizupfi.deck:device-api:1.0.0'
}

// The vendor driver jars are runtime plugins, never build inputs. Each implements
// ch.rupfizupfi.deck:device-api in its own repo (../dscusb, ../usbmodbus — both composite-include
// device-api, so THEIR compile is the contract-conformance check) and ships a Spring Boot
// auto-configuration that registers its provider beans. Nothing in this module names a driver class.
//
// The boot jar therefore contains NO driver, in any build: bootJar runs through PropertiesLauncher
// (see the manifest below) and the drivers come from the loader.path directories at launch. A jar
// present there is loaded, a jar absent is not, and absence stays a *startup* failure named by
// HardwareModeCheck — put the jar in place and restart, no rebuild. That is also what keeps the
// licence-restricted usbmodbus.jar out of the docker image: it is only ever a host mount.
//
// deckDrivers=local is the bench escape hatch for driving real hardware from `bootRun`, which runs
// off the classpath rather than the jar. developmentOnly is deliberate — the Spring Boot plugin
// excludes it from bootJar, so even a jar built with -PdeckDrivers=local stays driver-free.
def deckDrivers = providers.gradleProperty('deckDrivers').getOrElse('off')
if (!(deckDrivers in ['off', 'local'])) {
    throw new GradleException("deckDrivers=${deckDrivers} is not valid. Valid values: off, local. "
            + "('auto' is gone: drivers load at runtime from loader.path, not from the build.)")
}

if (deckDrivers == 'local') {
    def driverJars = fileTree("${rootProject.projectDir}/lib") { include '*.jar' }
    dependencies {
        developmentOnly driverJars
    }
    def names = driverJars.files.collect { it.name }.sort()
    logger.lifecycle(":command-deck: deckDrivers=local - bootRun loads driver plugins from lib/: "
            + (names ? names.join(', ') : "none - deck.hardware.mode=real will refuse to start"))
}

// The PUBLIC driver plugin, staged into the docker image by stageDrivers below. Resolved only by
// that task: `build`, `bootRun` and `hillaGenerate` never touch this repository, so a fresh clone
// builds with no credentials — GitHub Packages demands a token even for public reads.
// mavenLocal comes first on purpose: `publishToMavenLocal` in ../dscusb is how an unpublished
// driver gets exercised through the real loader.path, and it is inert inside the docker build,
// which has no ~/.m2. stageDrivers logs the file it staged so version skew stays visible.
repositories {
    mavenLocal {
        content { includeGroup 'ch.rupfizupfi.dscusb' }
    }
    maven {
        name = 'GitHubPackagesDscusb'
        url = uri('https://maven.pkg.github.com/rupfizupfi/dscusb')
        credentials {
            username = providers.environmentVariable('GITHUB_ACTOR').getOrElse('')
            password = providers.environmentVariable('GITHUB_TOKEN').getOrElse('')
        }
        content { includeGroup 'ch.rupfizupfi.dscusb' }
    }
}

// Gradle 9 role-locked configurations: dependencies are declared against the dependencyScope and
// resolved through the resolvable one. Declaring them on the resolvable configuration is an error.
configurations {
    dependencyScope('driverPlugins')
    resolvable('deckDriver') {
        extendsFrom driverPlugins
        // Defensive: the published pom has no dependencies, and a driver plugin's own deps are
        // already inside its shadow jar. Nothing else may ride along into the plugin directory.
        transitive = false
    }
}

dependencies {
    driverPlugins "ch.rupfizupfi.dscusb:dscusb:${providers.gradleProperty('dscusbVersion').getOrElse('0.2.0')}"
}

tasks.register('stageDrivers', StageDriverPlugins) {
    group = 'distribution'
    description = 'Resolves the public driver plugins into build/drivers for the docker image.'
    // lenient: a driver that cannot be resolved - no token, offline, version not published yet -
    // must NOT fail the build. A missing driver is a *startup* failure named by HardwareModeCheck,
    // and that rule holds for the image build too: an unreachable artifact repository is not a
    // reason to be unable to build the application. The task warns instead.
    plugins.from(configurations.deckDriver.incoming.artifactView { lenient = true }.files)
    stagingDir = layout.buildDirectory.dir('drivers')
}

// The Vaadin plugin queries the runtime classpath while its tasks execute, without declaring a
// task dependency on it — with device-api coming from an included build, a standalone
// `hillaGenerate` (script/typecheck.ps1) then fails with "querying ... before task
// ':device-api:jar' has completed is not supported". Compilation forces the jar as a side effect,
// which is why `build` never sees this; the Vaadin/Hilla tasks need it stated.
def deviceApiJar = gradle.includedBuild('device-api').task(':jar')
tasks.matching {
    it.name in ['hillaGenerate', 'hillaConfigure', 'vaadinPrepareFrontend', 'vaadinBuildFrontend']
}.configureEach {
    dependsOn deviceApiJar
}

bootJar {
    // Specific configuration for Command Deck application JAR
    archiveBaseName = 'command-deck-application'
    enabled = true
    manifest {
        // PropertiesLauncher instead of the plugin's default JarLauncher: it extends the classpath
        // with the directories named by loader.path (LOADER_PATH env / -Dloader.path), which is how
        // the driver plugins get loaded at launch instead of being baked in. Start-Class and
        // Spring-Boot-Classes/Lib are still written by the plugin, so BOOT-INF stays on the
        // classpath and the app itself starts exactly as before. Boot 4 moved the launcher into
        // org.springframework.boot.loader.launch — the pre-3.2 name would fail with CNFE.
        attributes 'Main-Class': 'org.springframework.boot.loader.launch.PropertiesLauncher'
    }
}

jar {
    // Library JAR configuration for shared components
    archiveBaseName = 'command-deck-library'
    enabled = true
}

/**
 * Syncs the resolved driver plugins into the staging directory the docker image copies.
 *
 * A plain Sync task cannot do this job: with nothing resolved its source is empty, Gradle reports
 * NO-SOURCE and skips it entirely — leaving no directory for the Dockerfile to COPY (which would
 * fail the image build) and no warning that the driver is missing. This always runs, and its
 * @OutputDirectory guarantees the directory exists even when empty.
 *
 * Sync semantics, not copy: a version bump must remove the jar it replaces, or loader.path would
 * offer both and the older one could win.
 */
abstract class StageDriverPlugins extends DefaultTask {

    @InputFiles
    abstract ConfigurableFileCollection getPlugins()

    @OutputDirectory
    abstract DirectoryProperty getStagingDir()

    @Inject
    abstract FileSystemOperations getFs()

    @TaskAction
    void stage() {
        fs.sync {
            it.from(plugins)
            it.into(stagingDir)
        }

        def names = (stagingDir.get().asFile.listFiles() ?: []).collect { it.name }.sort()
        if (names) {
            logger.lifecycle(":command-deck: staged driver plugins: " + names.join(', '))
        } else {
            logger.warn(":command-deck: WARNING - no driver plugin could be staged. The artifact is "
                    + "unreachable (no GITHUB_TOKEN, offline, or the pinned version is not "
                    + "published). This is deliberately not a build failure - the jar that comes "
                    + "out is valid. But with deck.hardware.mode=real it will refuse to start and "
                    + "name the missing provider. See doc/03-backend/driver-jars.md.")
        }
    }
}
