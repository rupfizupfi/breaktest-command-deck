// The hardware contract, and the JDK-only call gate gated drive providers share (the support
// package). Keep it dependency-free: every consumer (the deck, dscusb, usbmodbus)
// substitutes this build, so a dependency here lands on all of their classpaths. The test fixtures
// are the exception that proves it: their dependencies reach only a consumer's test classpath,
// never its main one or a plugin jar.
plugins {
    id 'java-library'
    id 'java-test-fixtures'
    id 'maven-publish'
}

group = 'ch.rupfizupfi.deck'
// Semver against the driver repos as providers — the bump rules live in the api package-info.
version = '1.7.0'

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(26))
    }
}

// ContractVersion is generated so the constant DeviceApi's skew check compares cannot drift from
// the Gradle version above.
def generateContractVersion = tasks.register('generateContractVersion', WriteContractVersion) {
    // Read eagerly: a Provider closing over `project` breaks the configuration cache.
    contractVersion = project.version.toString()
    outputDir = layout.buildDirectory.dir('generated/sources/contract-version/java/main')
}
sourceSets.main.java.srcDir(generateContractVersion)

repositories {
    mavenCentral()
}

// DriveContractTest and LoadCellStreamContractTest: abstract JUnit classes every provider - the
// deck's simulator and both driver repos - extends with a fixture of its own, so a provider that
// drifts from the contract fails a test rather than a run. Consumers take them with
// testImplementation(testFixtures(...)); the versions are the floor, a consumer's own BOM wins.
dependencies {
    testFixturesApi 'org.junit.jupiter:junit-jupiter-api:6.0.3'
    testFixturesApi 'org.assertj:assertj-core:3.27.7'

    // device-api's own suite (the support package's scheduler). Test scope only, so it reaches no
    // consumer; :command-deck:test runs it, which puts it in the jvm gate.
    testImplementation 'org.junit.jupiter:junit-jupiter:6.0.3'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.0.3'
}

tasks.named('test') {
    useJUnitPlatform()
    // Never UP-TO-DATE: the jvm gate reaches this suite only through :command-deck:test's
    // dependsOn, and a gate run that skipped it would vouch for results it never produced (~5 s).
    outputs.upToDateWhen { false }
}

// Published by .github/workflows/device-api.yml on a version bump, or by hand with
// `./gradlew -p device-api publish` (GITHUB_ACTOR/GITHUB_TOKEN set). Used only where there is no
// sibling deck checkout; dev builds use the composite include. See
// doc/dev/backend/device-api.md#contract-evolution.
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/rupfizupfi/breaktest-command-deck')
            credentials {
                username = System.getenv('GITHUB_ACTOR')
                password = System.getenv('GITHUB_TOKEN')
            }
        }
    }
}

/**
 * Writes ch.rupfizupfi.deck.device.api.ContractVersion from this build's version.
 *
 * The constant must stay a String literal so javac inlines it into driver class files; see
 * DeviceApi's javadoc.
 */
abstract class WriteContractVersion extends DefaultTask {

    @Input
    abstract Property<String> getContractVersion()

    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @TaskAction
    void generate() {
        def dir = outputDir.get().dir('ch/rupfizupfi/deck/device/api').asFile
        dir.mkdirs()
        new File(dir, 'ContractVersion.java').text = """\
package ch.rupfizupfi.deck.device.api;

/**
 * The version of this contract, generated from device-api's Gradle version - do not edit.
 *
 * <p>{@link #VALUE} is a compile-time constant, so javac inlines it into every reader; see
 * {@link DeviceApi}.
 */
public final class ContractVersion {

    public static final String VALUE = "${contractVersion.get()}";

    private ContractVersion() {
    }
}
"""
    }
}
