// A standalone build so the driver repos (../../dscusb, ../../usbmodbus) can composite-include it
// without the deck's Spring Boot / Vaadin build. The deck includes it from the root settings.gradle.
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'device-api'
