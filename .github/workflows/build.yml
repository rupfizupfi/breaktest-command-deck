name: build

# Application build and typecheck gate. The device-api contract is built by device-api.yml.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR supersedes the run in flight; main runs are never cancelled.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Holds `<!-- inventory: enum ... -->` doc tables to the enum's constants, so a code-only
      # change can break it. Runs first because it needs no build. The other doc gates run via /deck-doc.
      - name: Doc inventories match the code
        run: python3 doc/_check-inventories.py

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '26'

      - uses: gradle/actions/setup-gradle@v6

      # Before setup-node, whose pnpm cache needs the binary on PATH. No packageManager field in
      # either package.json, so the major that wrote the lockfiles is pinned here.
      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          # Matches the bench/dev machine the lockfiles were resolved on.
          node-version: '26'
          cache: pnpm
          cache-dependency-path: |
            cms/pnpm-lock.yaml
            command-deck/pnpm-lock.yaml

      # Before the Gradle build: its Vaadin frontend tasks can rewrite pnpm-lock.yaml, which would
      # break --frozen-lockfile.
      - name: Install cms frontend dependencies
        working-directory: cms
        run: pnpm install --frozen-lockfile

      - name: Install command-deck frontend dependencies
        working-directory: command-deck
        run: pnpm install --frozen-lockfile

      # Before the Gradle build for the same lockfile reason. Node env only, no browser.
      - name: Frontend logic tests (Vitest, cms)
        working-directory: cms
        run: pnpm test

      - name: Frontend logic tests (Vitest, command-deck)
        working-directory: command-deck
        run: pnpm test

      # productionMode runs vaadinBuildFrontend, which produces the untracked Vaadin scaffolding
      # (generated-flow-imports.js, app-shell-imports.js, vaadin-react.js) the typecheck needs.
      # typecheck.ps1 does not do this itself because those tasks can rewrite pnpm-lock.yaml.
      # Also runs the unit suites. Needs no credentials: drivers are launch-time plugins.
      - name: Build
        run: ./gradlew build -Pvaadin.productionMode=true --no-daemon

      # Same script as local runs; see its header for the hillaGenerate quirks it handles.
      - name: Typecheck (regenerate Hilla client, then tsc --noEmit)
        shell: pwsh
        run: ./script/typecheck.ps1
