name: device-api

# Builds and publishes the device-api contract only; the application is built by build.yml.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR supersedes the run in flight; main runs (which may publish) are never cancelled.
concurrency:
  group: device-api-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  device-api:
    runs-on: ubuntu-latest
    # packages: write is only exercised by the publish step below; it is granted to this job alone.
    permissions:
      contents: read
      packages: write
    steps:
      # Full history: the version check diffs against the push's start commit, which a
      # rebase-merge puts several commits back.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'

      - uses: gradle/actions/setup-gradle@v4

      # Standalone build, without configuring the deck's Spring Boot / Vaadin build.
      - name: Build the contract
        run: ./gradlew -p device-api build --no-daemon

      # Publishes only when the version in device-api/build.gradle changes (not on tags). The
      # version is also the startup skew check drivers run (DeviceApi); bump rules are in the
      # api package-info.
      - name: Detect version change
        id: version
        env:
          # Not HEAD~1: after a rebase-merge that is one of the pushed commits.
          PUSHED_FROM: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # Anchored so other coordinate versions in the file cannot match.
          extract() { grep -E "^version *= *'" | head -1 | sed -E "s/^version *= *'([^']*)'.*/\1/"; }
          current=$(extract < device-api/build.gradle)

          base="${PUSHED_FROM:-}"
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            # No push context (a pull_request run) or a branch's first push: fall back.
            base="HEAD~1"
          fi
          previous=$(git show "${base}:device-api/build.gradle" 2>/dev/null | extract || true)
          echo "current=$current" >> "$GITHUB_OUTPUT"
          if [ "$current" != "$previous" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "device-api $previous -> $current, will publish" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "device-api unchanged at $current, nothing to publish" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Consumers without a sibling deck checkout resolve this artifact instead of the live source
      # (both driver repos fall back to it). See
      # doc/dev/backend/device-api.md#contract-evolution.
      - name: Publish to GitHub Packages
        if: github.event_name == 'push' && steps.version.outputs.changed == 'true'
        env:
          # GITHUB_ACTOR is a default Actions variable; the build reads both.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew -p device-api publish --no-daemon
