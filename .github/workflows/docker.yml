name: docker

# Proves both images still build and the compose file still parses. Nothing is pushed.
# The Dockerfile is multi-stage and runs `gradle bootJar` inside the image, so this repeats part of
# build.yml's work by design (the image build is the only thing that exercises the Dockerfile's own
# context, .dockerignore and COPY paths). The paths filter keeps that cost off PRs that cannot affect an image.
on:
  pull_request:
    paths:
      - 'docker/**'
      - 'cms/**'
      - 'command-deck/**'
      - 'device-api/**'
      - '*.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - '.dockerignore'
      - '.github/workflows/docker.yml'
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - 'cms/**'
      - 'command-deck/**'
      - 'device-api/**'
      - '*.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - '.dockerignore'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The db-password secret is a file reference; compose config fails if the file is missing.
      - name: Placeholder secret
        run: mkdir -p .secrets && echo ci > .secrets/db-password.txt

      - name: Parse compose, both profiles
        run: |
          docker compose -f docker/docker-compose.yaml --profile cms config --quiet
          docker compose -f docker/docker-compose.yaml --profile deck config --quiet

  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [cms, command-deck]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.module }} image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          build-args: MODULE=${{ matrix.module }}
          push: false
          cache-from: type=gha,scope=${{ matrix.module }}
          cache-to: type=gha,scope=${{ matrix.module }},mode=max
